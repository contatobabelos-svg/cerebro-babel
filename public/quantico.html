<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Mundo Quântico</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #02030a; cursor: none; }
  canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<canvas id="hud"></canvas>
<script>
window.onerror = (m, src, l, c, e) => console.log('[QW] erro:', m, e && e.stack);
// ---------------------------------------------------------------------------
// "Campo Quântico Emaranhado": em vez de um único átomo isolado, uma rede de qubits
// em superposição, ligados aos pares por emaranhamento (o vínculo continua mesmo à
// distância — ao "medir" um par os dois colapsam juntos), boiando sobre um campo de
// vácuo cheio de pares virtuais que nascem, crescem e se aniquilam, e um circuito
// quântico correndo ao fundo (as portas que causam essas medições).
// Referências: esfera de Bloch para 1 qubit + duas esferas/correlação para o par
// emaranhado (Q-CTRL; Bengtsson et al., "Geometric Visualizations of Single and
// Entangled Qubits", arXiv:2212.03448); pares virtuais do vácuo que crescem e se
// aniquilam (flutuações do campo quântico, QFT).
// Parâmetros (podem vir na URL: ?fps=30&scale=0.55&hud=trilhas&centro=0.5&parado=1)
// ---------------------------------------------------------------------------
const Q = new URLSearchParams(location.search);
const FPS = +Q.get('fps') || 30;
const SCALE = +Q.get('scale') || 0.55;      // resolução do canvas WebGL (esticado por CSS: fundo, não precisa de nitidez)
// no Cérebro: hud=trilhas mostra só o campo + a rede + o circuito (sem os textos, que
// brigariam com o painel); parado=1 desenha um quadro e para (prefers-reduced-motion)
const HUD = Q.get('hud') || 'tudo';
const PARADO = Q.get('parado') === '1';
const CENTER = [+Q.get('centro') || 0.5, 0.5];
let paused = false;
window.setPaused = v => { paused = !!v; };

// ---------------------------------------------------------------------------
// WebGL2, passe único: gradiente de fundo + espuma do vácuo (pares virtuais que
// nascem/crescem/se aniquilam) + campo de interferência (várias fontes de onda,
// como funções de onda se espalhando) + o corredor de emaranhamento em destaque.
// ---------------------------------------------------------------------------
const glc = document.getElementById('gl');
const gl = glc.getContext('webgl2', { antialias: false, alpha: false, powerPreference: 'low-power' });

const VS = `#version 300 es
in vec2 p; out vec2 v;
void main(){ v = p*0.5+0.5; gl_Position = vec4(p,0.,1.); }`;

const FS = `#version 300 es
precision highp float;
in vec2 v; out vec4 o;
uniform vec2 uRes; uniform float uT; uniform vec2 uCenter; uniform float uFlash; uniform vec2 uA; uniform vec2 uB;
const float TAU = 6.28318530718;

float hash(vec2 p){ p = fract(p*vec2(443.897,441.423)); p += dot(p,p.yx+19.19); return fract((p.x+p.y)*p.x); }

// segmento A-B: distância do ponto ao corredor de emaranhamento
float segDist(vec2 p, vec2 a, vec2 b){
  vec2 pa = p-a, ba = b-a;
  float h = clamp(dot(pa,ba)/max(1e-5,dot(ba,ba)), 0., 1.);
  return length(pa - ba*h);
}

// espuma do vácuo: em cada célula, um par virtual (partícula + antipartícula) nasce no
// centro, se afasta até um máximo e volta a se aniquilar — como as flutuações do campo.
vec3 espuma(vec2 p, float t){
  vec3 col = vec3(0.);
  vec2 cel = vec2(0.078);
  vec2 gp = p/cel, base = floor(gp);
  for (int j=-1;j<=1;j++) for (int i=-1;i<=1;i++){
    vec2 c = base + vec2(i,j);
    float h0 = hash(c), h1 = hash(c+vec2(31.7,9.3)), h2 = hash(c+vec2(58.1,3.4));
    float vida = fract(t*(0.10+h0*0.28) + h1*11.);
    float env = pow(max(0., sin(vida*3.14159265)), 2.2);      // nasce · cresce · some
    if (env < 0.004) continue;
    vec2 centro = (c + vec2(h1, h2)) * cel;
    float ang = h2*TAU + t*0.5*(h0-0.5);
    vec2 dir = vec2(cos(ang), sin(ang));
    float sep = env*0.55*cel.x;
    vec2 pa = centro + dir*sep, pb = centro - dir*sep;
    float r = 0.0016 + 0.003*env;
    col += vec3(0.28,0.8,1.0) * env * exp(-dot(p-pa,p-pa)/(r*r));    // partícula
    col += vec3(1.0,0.4,0.85) * env * exp(-dot(p-pb,p-pb)/(r*r));    // antipartícula
    col += vec3(0.5,0.42,0.95) * env*0.3 * exp(-dot(p-centro,p-centro)/(sep*sep*3.+1e-4));
  }
  return col;
}

// funções de onda se espalhando: fontes que orbitam devagar, interferindo entre si
float ondas(vec2 p, float t){
  float s = 0.;
  for (int i=0;i<5;i++){
    float f = float(i);
    float raio = 0.26 + 0.09*f, vel = (0.045+0.012*f) * (mod(f,2.)<0.5 ? 1. : -1.);
    vec2 fonte = raio*vec2(cos(t*vel+f*1.7), sin(t*vel+f*1.7)*0.82);
    float d = length(p-fonte);
    s += cos(d*44. - t*2.0)*exp(-d*1.7);
  }
  return s/5.;
}

void main(){
  vec2 fc = v*uRes;
  vec2 p = (fc - uCenter*uRes)/uRes.y;
  float t = uT;

  vec3 col = mix(vec3(0.006,0.008,0.022), vec3(0.02,0.024,0.06), 1.-smoothstep(0.,1.1,length(p)));
  col += vec3(0.14,0.32,0.8) * (0.5+0.5*ondas(p,t)) * 0.05;
  col += espuma(p, t);

  // corredor de emaranhamento: acende junto nas duas pontas quando uFlash sobe (medição)
  float dl = segDist(p, uA, uB);
  float feixe = exp(-dl*dl*260.) * (0.16 + 0.84*uFlash);
  col += mix(vec3(0.22,0.5,1.0), vec3(1.0), uFlash) * feixe;
  col += vec3(1.0) * uFlash * (exp(-dot(p-uA,p-uA)*820.) + exp(-dot(p-uB,p-uB)*820.));

  vec2 q = v-0.5;
  col *= 1. - dot(q,q)*0.85;
  col += (hash(fc+fract(t)*113.) - 0.5) * 0.015;
  col = 1. - exp(-col*1.25);
  o = vec4(pow(col, vec3(0.92)), 1.);
}`;

function compile(type, src){
  const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
  return s;
}
const prog = gl.createProgram();
gl.attachShader(prog, compile(gl.VERTEX_SHADER, VS));
gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, FS));
gl.bindAttribLocation(prog, 0, 'p');
gl.linkProgram(prog);
if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
const U = {}; for (const n of ['uRes','uT','uCenter','uFlash','uA','uB']) U[n] = gl.getUniformLocation(prog, n);
gl.useProgram(prog);

const quad = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, quad);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
gl.enableVertexAttribArray(0);
gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);

// ---------------------------------------------------------------------------
// Canvas 2D por cima: a rede de qubits, os pares emaranhados e o circuito quântico.
// ---------------------------------------------------------------------------
const hud = document.getElementById('hud');
const cx = hud.getContext('2d');
let W = 0, H = 0;

function resize(){
  W = innerWidth; H = innerHeight;
  glc.width = Math.max(2, Math.round(W*SCALE)); glc.height = Math.max(2, Math.round(H*SCALE));
  glc.style.width = W+'px'; glc.style.height = H+'px';
  hud.width = W; hud.height = H;
  montarRede();
}
addEventListener('resize', resize);

// --- rede de qubits: N nós espalhados (fora do miolo, que fica pro corredor de
// emaranhamento) e M pares emaranhados entre eles ---------------------------
let rngState = 20260918;
const rnd = () => ((rngState = (rngState*1664525 + 1013904223) >>> 0) / 4294967296);

const N_QUBITS = 26, N_PARES = 9;
let qubits = [], pares = [];
function montarRede(){
  rngState = 20260918;
  qubits = [];
  for (let i = 0; i < N_QUBITS; i++){
    let ux, uy;
    do { ux = rnd()*2-1; uy = rnd()*2-1; } while (Math.hypot(ux*(W/H), uy) < 0.3);
    qubits.push({
      ux, uy, fase: rnd()*Math.PI*2, freq: 0.25+rnd()*0.5, spin: rnd()*Math.PI*2, spinVel: (rnd()-0.5)*0.6,
      drift: rnd()*Math.PI*2, driftVel: 0.06+rnd()*0.08,
    });
  }
  pares = [];
  const usados = new Set();
  for (let k = 0; k < N_PARES; k++){
    let a, b, tent = 0;
    do { a = Math.floor(rnd()*N_QUBITS); b = Math.floor(rnd()*N_QUBITS); tent++; }
    while ((a === b || usados.has(a+'-'+b) || usados.has(b+'-'+a)) && tent < 40);
    if (a === b) continue;
    usados.add(a+'-'+b);
    pares.push({ a, b, faseComum: rnd()*Math.PI*2, ultimoFlash: -99 });
  }
}

function posQubit(qb, t){
  const dx = Math.cos(qb.drift + t*qb.driftVel)*0.012, dy = Math.sin(qb.drift*1.3 + t*qb.driftVel)*0.012;
  return { x: (CENTER[0] + (qb.ux+dx)*0.42)*W, y: (CENTER[1] + (qb.uy+dy)*0.42*Math.min(1,W/H))*H };
}
function corFase(a){
  const h = ((a/(Math.PI*2))%1+1)%1;
  const stops = [[0.10,0.72,1.0],[0.42,0.34,1.0],[0.95,0.30,0.78],[1.0,0.72,0.32]];
  const f = h*4, i = Math.floor(f)%4, k = f-Math.floor(f);
  const c0 = stops[i], c1 = stops[(i+1)%4];
  return [c0[0]+(c1[0]-c0[0])*k, c0[1]+(c1[1]-c0[1])*k, c0[2]+(c1[2]-c0[2])*k];
}

// --- circuito quântico: portas correndo, a medição (M) dispara o colapso ---------
const GATES = ['H', '●', '⊕', 'Rz', 'H', '●', '⊕', 'X', 'Z', 'M'];
const GATE_T = 1.9;   // segundos por porta
let ultimoCiclo = -1;
let flash = 0, flashPar = null, flashLabel = 0;

function tocarCircuito(t, now){
  const passo = t / GATE_T;
  const idx = Math.floor(passo) % GATES.length;
  const ciclo = Math.floor(passo / GATES.length);
  const chave = ciclo*GATES.length + idx;
  if (GATES[idx] === 'M' && chave !== ultimoCiclo){
    ultimoCiclo = chave;
    flashPar = pares.length ? pares[Math.floor(rnd()*pares.length)] : null;
    if (flashPar) flashPar.ultimoFlash = now;
    flashLabel = now;
  }
  return { idx, passo };
}

function drawRede(t, now){
  // corredor de emaranhamento (par em destaque) — as pontas alimentam o shader (uA/uB)
  let A = [0.15, 0], B = [-0.15, 0];
  if (flashPar){
    const qa = qubits[flashPar.a], qb = qubits[flashPar.b];
    const pa = posQubit(qa, t), pb = posQubit(qb, t);
    A = [(pa.x - CENTER[0]*W)/H, (pa.y - CENTER[1]*H)/H];
    B = [(pb.x - CENTER[0]*W)/H, (pb.y - CENTER[1]*H)/H];
  }
  gl.uniform2f(U.uA, A[0], A[1]);
  gl.uniform2f(U.uB, B[0], B[1]);

  // links dos pares
  for (const par of pares){
    const qa = qubits[par.a], qb = qubits[par.b];
    const pa = posQubit(qa, t), pb = posQubit(qb, t);
    const idade = now - par.ultimoFlash;
    const aceso = Math.exp(-Math.max(0, idade)*2.2);
    const faseComum = par.faseComum + t*0.35;
    const [r, g, b] = corFase(faseComum);
    cx.strokeStyle = `rgba(${r*255|0},${g*255|0},${b*255|0},${0.10+0.55*aceso})`;
    cx.lineWidth = 1 + 1.6*aceso;
    const mx = (pa.x+pb.x)/2 + (pa.y-pb.y)*0.08, my = (pa.y+pb.y)/2 - (pa.x-pb.x)*0.08;
    cx.beginPath(); cx.moveTo(pa.x, pa.y); cx.quadraticCurveTo(mx, my, pb.x, pb.y); cx.stroke();
    qa.fase = qb.fase = faseComum; // emaranhados: fase sempre igual
  }

  // nós
  for (const qb of qubits){
    const pos = posQubit(qb, t);
    const [r, g, b] = corFase(qb.fase + t*qb.freq*0.3);
    const raio = 2.1 + 0.9*Math.sin(t*1.4+qb.spin);
    const gr = cx.createRadialGradient(pos.x, pos.y, 0, pos.x, pos.y, raio*4.2);
    gr.addColorStop(0, `rgba(${r*255|0},${g*255|0},${b*255|0},0.55)`);
    gr.addColorStop(1, 'rgba(0,0,0,0)');
    cx.fillStyle = gr; cx.beginPath(); cx.arc(pos.x, pos.y, raio*4.2, 0, 7); cx.fill();
    cx.fillStyle = `rgba(${r*255|0},${g*255|0},${b*255|0},0.9)`;
    cx.beginPath(); cx.arc(pos.x, pos.y, raio, 0, 7); cx.fill();
    // vetor de spin (Bloch simplificado, em 2D)
    const sa = qb.spin + t*qb.spinVel;
    cx.strokeStyle = `rgba(255,255,255,0.35)`; cx.lineWidth = 1;
    cx.beginPath(); cx.moveTo(pos.x, pos.y); cx.lineTo(pos.x+Math.cos(sa)*raio*3.4, pos.y+Math.sin(sa)*raio*3.4); cx.stroke();
  }

  // flash do par medido: estouro branco nas duas pontas, simultâneo
  if (flashPar){
    const idade = now - flashPar.ultimoFlash;
    const k = Math.exp(-Math.max(0, idade)*3.2);
    if (k > 0.01){
      for (const id of [flashPar.a, flashPar.b]){
        const pos = posQubit(qubits[id], t);
        const gr = cx.createRadialGradient(pos.x, pos.y, 0, pos.x, pos.y, 30*k+4);
        gr.addColorStop(0, `rgba(255,255,255,${0.85*k})`); gr.addColorStop(1, 'rgba(255,255,255,0)');
        cx.fillStyle = gr; cx.beginPath(); cx.arc(pos.x, pos.y, 30*k+4, 0, 7); cx.fill();
      }
    }
  }
  const idadeLbl = now - flashLabel;
  if (HUD === 'tudo' && idadeLbl < 2.2 && idadeLbl >= 0){
    const a = idadeLbl < 0.3 ? idadeLbl/0.3 : 1 - Math.max(0, idadeLbl-1.6)/0.6;
    cx.font = 'italic 13px "DejaVu Serif", serif';
    cx.fillStyle = `rgba(220,235,255,${0.75*Math.max(0,Math.min(1,a))})`;
    cx.textAlign = 'center';
    cx.fillText('medição → colapso correlacionado, mesmo à distância', CENTER[0]*W, CENTER[1]*H - 40);
    cx.textAlign = 'left';
  }
}

// --- tira do circuito, correndo no rodapé -----------------------------------
function drawCircuito(t, info){
  const y = H - (HUD === 'tudo' ? 66 : 34), passoPx = Math.min(70, W*0.055);
  const playX = W*0.5;
  cx.save();
  cx.strokeStyle = 'rgba(150,190,255,0.18)'; cx.lineWidth = 1;
  cx.beginPath(); cx.moveTo(playX-passoPx*5.6, y); cx.lineTo(playX+passoPx*5.6, y); cx.stroke();
  cx.strokeStyle = 'rgba(255,255,255,0.28)';
  cx.beginPath(); cx.moveTo(playX, y-16); cx.lineTo(playX, y+16); cx.stroke();
  const frac = info.passo - Math.floor(info.passo);
  for (let d = -5; d <= 5; d++){
    const gi = ((Math.floor(info.passo)+d) % GATES.length + GATES.length) % GATES.length;
    const x = playX + (d - frac)*passoPx;
    const perto = 1 - Math.min(1, Math.abs(d - frac + 0.0));
    const medindo = GATES[gi] === 'M';
    cx.font = `${medindo ? 'bold ' : ''}15px "DejaVu Sans Mono", monospace`;
    cx.fillStyle = medindo ? `rgba(255,190,220,${0.5+0.5*perto})` : `rgba(180,205,255,${0.35+0.4*perto})`;
    cx.textAlign = 'center'; cx.textBaseline = 'middle';
    cx.fillText(GATES[gi], x, y);
  }
  if (HUD === 'tudo'){
    cx.font = '10px "Inter", sans-serif';
    cx.fillStyle = 'rgba(150,185,245,0.45)';
    cx.fillText('CIRCUITO · H emaranha · CNOT (●⊕) correlaciona · M mede e colapsa', playX, y+26);
  }
  cx.textAlign = 'left'; cx.textBaseline = 'alphabetic';
  cx.restore();
}

function drawNotes(){
  cx.save();
  cx.font = 'italic 19px "DejaVu Serif", serif';
  cx.fillStyle = 'rgba(200,220,255,0.75)';
  cx.fillText('|Φ⁺⟩ = (|00⟩ + |11⟩) / √2', 56, H-150);
  cx.font = '12px "Inter", sans-serif';
  cx.fillStyle = 'rgba(150,185,245,0.5)';
  cx.fillText('REDE DE QUBITS EMARANHADOS · cor = fase · brilho = medição recente', 56, H-128);
  cx.fillText(`${N_QUBITS} qubits · ${pares.length} pares emaranhados · vácuo em flutuação ao fundo`, 56, H-110);
  cx.restore();
}

// ---------------------------------------------------------------------------
// laço principal
// ---------------------------------------------------------------------------
resize();
const t0 = performance.now();
let last = 0;
function frame(nowMs){
  requestAnimationFrame(frame);
  if (paused) return;
  if (nowMs - last < 1000/FPS - 2) return;
  last = nowMs;
  const now = (nowMs - t0)/1000;
  const t = now;

  flash = flashPar ? Math.exp(-Math.max(0, now - flashPar.ultimoFlash)*3.2) : 0;

  gl.viewport(0, 0, glc.width, glc.height);
  gl.uniform2f(U.uRes, glc.width, glc.height);
  gl.uniform1f(U.uT, t);
  gl.uniform2f(U.uCenter, CENTER[0], CENTER[1]);
  gl.uniform1f(U.uFlash, flash);

  cx.clearRect(0, 0, W, H);
  const info = tocarCircuito(t, now);
  drawRede(t, now);           // define uA/uB antes do desenho do passe WebGL
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  drawCircuito(t, info);
  if (HUD === 'tudo') drawNotes();

  if (PARADO) paused = true;
}
requestAnimationFrame(frame);
</script>
</body>
</html>
